name: Create Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The tag must use the format vMAJOR.MINOR.PATCH, for example v1.0.0."
            exit 1
          fi

      - name: Build add-on ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          tag = os.environ["TAG"]
          root = Path(".")
          package_root = Path("simple_baker")
          output_dir = Path("dist")
          output_dir.mkdir()

          root_files = [
              "__init__.py",
              "constants.py",
              "i18n.py",
              "models.py",
              "operators.py",
              "preferences.py",
              "properties.py",
              "ui.py",
              "README.md",
              "LICENSE",
          ]

          missing = [path for path in root_files if not (root / path).is_file()]
          if missing:
              raise SystemExit(f"Required release files are missing: {', '.join(missing)}")

          service_files = sorted(
              path
              for path in (root / "services").rglob("*.py")
              if "__pycache__" not in path.parts
          )
          if not service_files:
              raise SystemExit("No service modules were found.")

          archive = output_dir / f"simple_baker-{tag}.zip"
          with ZipFile(archive, "w", ZIP_DEFLATED) as zip_file:
              for relative_path in root_files:
                  zip_file.write(relative_path, package_root / relative_path)
              for source_path in service_files:
                  zip_file.write(source_path, package_root / source_path)

          print(f"Created {archive}")
          PY

          sha256sum "dist/simple_baker-${TAG}.zip" > "dist/simple_baker-${TAG}.zip.sha256"
          unzip -l "dist/simple_baker-${TAG}.zip"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ZIP="dist/simple_baker-${TAG}.zip"
          CHECKSUM="${ZIP}.sha256"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$CHECKSUM" --clobber
          else
            gh release create "$TAG" "$ZIP" "$CHECKSUM" \
              --title "Simple Baker ${TAG}" \
              --generate-notes
          fi